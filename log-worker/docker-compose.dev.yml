version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: log-worker-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: log-worker-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  log-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-worker-service
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
      MONGO_URI: mongodb://mongodb:27017
      # S3_ENDPOINT_URL මෙතැනින් සම්පූර්ණයෙන්ම ඉවත් කර ඇත (කෙලින්ම AWS S3 වෙත යයි)
    depends_on:
      - rabbitmq
      - mongodb
    restart: unless-stopped

volumes:
  rabbitmq_data:
  mongodb_data: