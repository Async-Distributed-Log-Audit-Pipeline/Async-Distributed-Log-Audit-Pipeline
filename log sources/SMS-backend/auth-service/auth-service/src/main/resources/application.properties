spring.application.name=auth-service

server.port = 8084
logging.structured.format.file=logstash
logging.file.name=${LOG_FILE_PATH:logs/auth-service.jsonl}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/SMS_Auth_DB?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Himebw115}

#jpa vendor adapter configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

#spring.security.user.name=himesh
#spring.security.user.password=Himebw115

spring.jpa.properties.hibernate.types.print.banner=true
spring.jpa.properties.hibernate.types.jackson.mapper=com.fasterxml.jackson.databind.ObjectMapper

#Circular dependencyy reference ek se up krnne mehema
spring.main.allow-circular-references=true

##Eureka server clinet kathawa
eureka.client.service-url.defaultZone=http://${EUREKA_SERVER:localhost}:8761/eureka
eureka.instance.prefer-ip-address=true

