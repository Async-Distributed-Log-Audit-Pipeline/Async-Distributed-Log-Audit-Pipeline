# version: '3.8'

services:
  # Service Registry (Eureka)
  service-registry:
    build:
      context: ./service-registry/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - LOG_FILE_PATH=/logs/service-registry.jsonl
    volumes:
      - runtime-logs:/logs
    networks:
      - sms-network

  # Student Database
  student-db:
    image: mysql:8.0
    container_name: student-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Himebw115
      MYSQL_DATABASE: SMS_Students_db
    ports:
      - "3307:3306"
    volumes:
      - student-data:/var/lib/mysql
    networks:
      - sms-network

  # Course Database
  course-db:
    image: mysql:8.0
    container_name: course-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Himebw115
      MYSQL_DATABASE: SMS_Course_db
    ports:
      - "3308:3306"
    volumes:
      - course-data:/var/lib/mysql
    networks:
      - sms-network

  # Auth Database
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Himebw115
      MYSQL_DATABASE: SMS_Auth_db
    ports:
      - "3309:3306"
    volumes:
      - auth-data:/var/lib/mysql
    networks:
      - sms-network

  # Audit Database
  audit-db:
    image: mysql:8.0
    container_name: audit-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Himebw115
      MYSQL_DATABASE: SMS_Audit_db
    ports:
      - "3310:3306"
    volumes:
      - audit-data:/var/lib/mysql
    networks:
      - sms-network

  # Auth Service
  auth-service:
    build:
      context: ./auth-service/auth-service
    container_name: auth-service
    ports:
      - "8084:8084"
    environment:
      - MYSQL_HOST=auth-db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Himebw115
      - EUREKA_SERVER=service-registry
      - LOG_FILE_PATH=/logs/auth-service.jsonl
    volumes:
      - runtime-logs:/logs

    depends_on:
      - auth-db
      - service-registry
    networks:
      - sms-network

  # Student Service
  student-service:
    build:
      context: ./student-service/student-service
    container_name: student-service
    ports:
      - "8082:8082"
    environment:
      - MYSQL_HOST=student-db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Himebw115
      - EUREKA_SERVER=service-registry
      - LOG_FILE_PATH=/logs/student-service.jsonl
    volumes:
      - runtime-logs:/logs
    depends_on:
      - student-db
      - service-registry
    networks:
      - sms-network

  # Course Service
  course-service:
    build:
      context: ./course-service/course-service
    container_name: course-service
    ports:
      - "8083:8083"
    environment:
      - MYSQL_HOST=course-db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Himebw115
      - EUREKA_SERVER=service-registry
      - LOG_FILE_PATH=/logs/course-service.jsonl
    volumes:
      - runtime-logs:/logs
    depends_on:
      - course-db
      - service-registry
    networks:
      - sms-network

  # Audit Service
  audit-service:
    build:
      context: ./audit-service/audit-service
    container_name: audit-service
    ports:
      - "8085:8085"
    environment:
      - MYSQL_HOST=audit-db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Himebw115
      - EUREKA_SERVER=service-registry
      - LOG_FILE_PATH=/logs/audit-service.jsonl
      - LOGS_DIRECTORY=/logs
    volumes:
      - runtime-logs:/logs
    depends_on:
      - audit-db
      - service-registry
    networks:
      - sms-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway/api-gateway
    container_name: api-gateway
    ports:
      - "9191:9191"
    environment:
      - EUREKA_SERVER=service-registry
      - LOG_FILE_PATH=/logs/api-gateway.jsonl
    volumes:
      - runtime-logs:/logs
    depends_on:
      - service-registry
      - student-service
      - course-service
      - auth-service
    networks:
      - sms-network

  # Frontend
#  sms-frontend:
#    build:
#      context: ../SMS-frontend/Student-management-system
#      dockerfile: Dockerfile
#      args:
#        - VITE_API_BASE_URL=http://localhost:9191
#    container_name: sms-frontend
#    ports:
#      - "8081:80"
#    depends_on:
#      - api-gateway
#    networks:
#      - sms-network

networks:
  sms-network:
    driver: bridge

volumes:
  student-data:
  course-data:
  auth-data:
  audit-data:
  runtime-logs:
