services:
  sms-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:9191
    container_name: sms-frontend
    ports:
      - "8081:80"
    networks:
      - sms-network

networks:
  sms-network:
    external: true
    name: sms-backend_sms-network
