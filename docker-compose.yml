# ============================================================
# Async Distributed Log & Audit Analytics Pipeline
# Root docker-compose.yml — orchestrates all pipeline services
#
# Usage:
#   docker compose up --build -d
#
# To run TWO log-worker replicas (plain Compose, not Swarm):
#   docker compose up --build -d --scale log-worker=2
#   NOTE: The log-worker service has no container_name so Compose
#         can freely name the replicas when --scale is used.
# ============================================================

services:

  # ──────────────────────────────────────────
  # INFRASTRUCTURE: Message Broker
  # ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI  →  http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # INFRASTRUCTURE: Document Store
  # ──────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # INFRASTRUCTURE: Object Storage (MinIO)
  # Console UI  →  http://localhost:9001
  # S3 API      →  http://localhost:9000
  # ──────────────────────────────────────────
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # MinIO console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # ONE-SHOT INIT: Apply MongoDB schema +
  # indexes. Exits after completion.
  # Do NOT add seed_services.py here.
  # Manual demo seeding:
  #   docker compose run --rm db-init python seed_services.py
  # ──────────────────────────────────────────
  db-init:
    build:
      context: ./db
      dockerfile: Dockerfile
    command: ["sh", "-c", "python setup_schema_and_indexes.py && python ensure_bucket.py"]
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: log_analytics
      MONGO_COLLECTION: ingestions
      # MinIO vars are present so seed_services.py works if run manually
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: raw-logs
      S3_REGION: us-east-1
      # RabbitMQ vars are present so seed_services.py works if run manually
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE_NAME: log-ingestion-queue
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  # ──────────────────────────────────────────
  # SERVICE: Log Ingestion API (FastAPI)
  # Swagger UI  →  http://localhost:8000/docs
  # ──────────────────────────────────────────
  log-ingestion-api:
    build:
      context: ./log-ingestion-api/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Server
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: "*"
      MAX_UPLOAD_BYTES: "10485760"
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE_NAME: log-ingestion-queue
      # MongoDB
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: log_analytics
      MONGO_COLLECTION: ingestions
      # MinIO / S3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: raw-logs
      S3_REGION: us-east-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ──────────────────────────────────────────
  # SERVICE: Log Worker (async processor)
  # No port exposed; pulls from RabbitMQ queue.
  #
  # Scale to 2 replicas:
  #   docker compose up --build -d --scale log-worker=2
  # ──────────────────────────────────────────
  log-worker:
    build:
      context: ./log-worker
      dockerfile: Dockerfile
    environment:
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE_NAME: log-ingestion-queue
      RABBITMQ_DLQ_NAME: log-ingestion-dlq
      RABBITMQ_HEARTBEAT: "600"
      PREFETCH_COUNT: "1"
      # MongoDB
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: log_analytics
      MONGO_COLLECTION: ingestions
      # MinIO / S3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: raw-logs
      S3_REGION: us-east-1
      # Worker tuning
      MAX_RETRIES: "3"
      RETRY_BASE_DELAY_SECONDS: "2"
      RETRY_MAX_DELAY_SECONDS: "60"
      MAX_SKIPPED_RATIO: "0.5"
      DEBUG_PROCESSING_DELAY_SECONDS: "0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ──────────────────────────────────────────
  # SERVICE: Analytics Dashboard (Streamlit)
  # Dashboard  →  http://localhost:8501
  # ──────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://log-ingestion-api:8000
      DEMO_MODE: "false"
    depends_on:
      - log-ingestion-api
    restart: unless-stopped


# ──────────────────────────────────────────
# Named Volumes (persist across restarts)
# ──────────────────────────────────────────
volumes:
  rabbitmq_data:
  mongodb_data:
  minio_data:
